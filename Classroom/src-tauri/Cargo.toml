[package]
name = "chain-classroom"
version = "0.1.3"
edition = "2021"
default-run = "chain-classroom"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-single-instance = "2"
dunce = "1"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

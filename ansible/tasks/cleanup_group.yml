- name: Recover every recorded case even when the controller driver failed
  ansible.builtin.command:
    argv: ["{{ chain_python }}", "{{ chain_tools_root }}/managed_worker.py"]
    stdin: "{{ {'action': 'cleanup-group', 'root': chain_test_root, 'run_group': chain_run_group, 'owner': chain_run_owner, 'release_root': chain_release_root} | to_json }}"
  register: chain_cleanup_result
  changed_when: true
  failed_when: false
- name: Create the controller recovery directory
  ansible.builtin.file:
    path: "{{ chain_result_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
- name: Save recovery evidence locally
  ansible.builtin.copy:
    content: "{{ chain_cleanup_result.stdout }}\n"
    dest: "{{ chain_result_dir }}/cleanup-{{ chain_node_id }}.json"
    mode: '0644'
  delegate_to: localhost
  become: false
- name: Surface incomplete recovery without hiding other host results
  ansible.builtin.assert:
    that:
      - chain_cleanup_result.rc == 0
      - (chain_cleanup_result.stdout | from_json).ok

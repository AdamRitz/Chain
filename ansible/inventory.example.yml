all:
  children:
    chain:
      hosts:
        node001:
          ansible_host: 203.0.113.10
          chain_p2p_address: 192.0.2.10
          chain_node_id: node001
        node002:
          ansible_host: 203.0.113.11
          chain_p2p_address: 192.0.2.11
          chain_node_id: node002
      vars:
        ansible_user: root
        # For private hosts use an SSH key and a reachable gateway, for example:
